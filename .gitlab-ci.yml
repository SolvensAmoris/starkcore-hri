stages:
    - cairo
    - deploy

cairo_build:
  stage: cairo
  image: rust:1.82-bookworm
  before_script:
        - apt-get update -y && apt-get install -y curl -y
        - curl -L https://github.com/software-mansion/scarb/releases/download/v2.20.0/scarb-v2.20.0-x86_64-unknown-linux-gnu.tar.gz -o /tmp/scarb.tar.gz
        - tar -xzf /tmp/scarb.tar.gz -C /tmp
        - cp /tmp/scarb-v2.20.0-x86_64-unknown-linux-gnu/bin/scarb /usr/local/bin/scarb
        - chmod +x /usr/local/bin/scarb
  script:
        - cd cairo_verifier && scarb build
  artifacts:
    paths:
            - cairo_verifier/target/

deploy-sepolia:
  stage: deploy
  needs:
        - cairo_build
  image: rust:1.82-bookworm
  before_script:
        - apt-get update -y && apt-get install -y curl git -y
        - curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/foundry-rs/starknet-foundry/master/scripts/install.sh | sh -s -- --no-modify-path
        - export PATH="$HOME/.local/bin:$PATH"
        - /root/.local/bin/snfoundryup -v 0.35.0
        - export PATH="$HOME/.snfoundry/bin:$PATH"
        - sncast --version
  variables:
    RPC: "https://api.cartridge.gg/x/starknet/sepolia"
  script:
        - export PATH="$HOME/.local/bin:$HOME/.snfoundry/bin:$PATH"
        - cd cairo_verifier
        - sncast account create --network sepolia --name myacc --type open-zeppelin --url $RPC || true
        - cat ~/.snfoundry/accounts/sepolia/myacc.json
        - sncast account deploy --network sepolia --name myacc --url $RPC
        - sncast declare --network sepolia --contract-name cosmos_burn_verifier --url $RPC --account myacc
  rules:
        - when: manual
