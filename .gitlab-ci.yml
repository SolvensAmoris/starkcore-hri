workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

stages: [.pre, verify, finalize]

p0_self_audit:
  stage: .pre
  image: python:3.11
  script:
    - python tests/test_p0_self_audit.py
  rules:
    - when: always

omega_self_audit:
  stage: verify
  image: python:3.11
  script:
    - python tests/test_omega_self_audit.py
  needs:
    - job: p0_self_audit
      optional: false
  rules:
    - when: on_success

omega_chain_audit:
  stage: finalize
  image: python:3.11
  script:
    - python tests/test_omega_chain_audit.py
  needs:
    - job: omega_self_audit
      optional: false
  rules:
    - when: on_success
