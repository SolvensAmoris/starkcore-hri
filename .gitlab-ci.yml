stages: [borromeo]

borromeo_character:
  stage: borromeo
  image: python:3.11-slim
  script:
    - pip install pytest --quiet
    - PYTHONPATH=src python -m pytest tests/test_borromeo_character.py -v
    - PYTHONPATH=src python tests/test_borromeo_character.py
  rules:
    - if: $CI_MERGE_REQUEST_ID
    - if: $CI_COMMIT_BRANCH == "main"

borromeo_gate:
  stage: borromeo
  image: python:3.11-slim
  script:
    - pip install pytest --quiet
    - |
      if git diff --name-only origin/main...HEAD | grep -Eq "^(docs/|attestations/|CausalForge/experiments/|WHITEPAPER.md|src/starkcore/)"; then
        echo "Claims tocados -> validador obligatorio"
        PYTHONPATH=src python -m pytest tests/ -v --tb=short
      else
        echo "Solo chore -> skip borromeo_gate"
      fi
  rules:
    - if: $CI_MERGE_REQUEST_ID
