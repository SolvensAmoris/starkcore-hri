stages:
    - audit
    - deploy

ca002_firewall:
  stage: audit
  image:
    name: alpine/git
    entrypoint: [""]
  script:
        - git fetch --tags
        - git cat-file -t $CI_COMMIT_TAG
        - git cat-file -t $CI_COMMIT_TAG | grep -q tag
        - echo "CA-002 OK E!=H RFC-0007"
  rules:
        - if: $CI_COMMIT_TAG
