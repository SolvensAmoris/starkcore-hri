stages: [cairo]

cairo_build:
  stage: cairo
  image: rust:1.82-bookworm
  before_script:
    - apt-get update -y && apt-get install -y curl -y
    - curl -L https://github.com/software-mansion/scarb/releases/download/v2.20.0/scarb-v2.20.0-x86_64-unknown-linux-gnu.tar.gz -o /tmp/scarb.tar.gz
    - tar -xzf /tmp/scarb.tar.gz -C /tmp
    - cp /tmp/scarb-v2.20.0-x86_64-unknown-linux-gnu/bin/scarb /usr/local/bin/scarb
    - chmod +x /usr/local/bin/scarb
    - scarb --version
  script:
    - cd cairo_verifier && scarb build
  artifacts:
    paths:
      - cairo_verifier/target/
