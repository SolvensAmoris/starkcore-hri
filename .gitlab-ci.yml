stages:
    - audit
    - deploy

ca002_firewall:
  stage: audit
  image: alpine/git
  script:
        - chmod +x ca002-check.sh
        - echo "StarkCore Firewall - Validando E = H"
        - git fetch --tags
        - ./ca002-check.sh $CI_COMMIT_TAG
  rules:
        - if: $CI_COMMIT_TAG

deploy:
  stage: deploy
  script:
        - echo "Deploy solo si paso el firewall"
  rules:
        - if: $CI_COMMIT_TAG
  needs:
        - ca002_firewall
