stages:
  - .pre
  - test
  - verify

p0_self_audit:
  stage: .pre
  image: python:3.11-slim
  script:
    - python3 tests/test_p0_self_audit.py
  artifacts:
    paths:
      - p0_evidence_manifest.json
    expire_in: never
    when: always

omega_self_audit:
  stage: test
  image: python:3.11-slim
  needs: [p0_self_audit]
  script:
    - python3 tests/test_omega_self_audit.py
  artifacts:
    paths:
      - evidence/omega/
    expire_in: never
    when: always

omega_chain_audit:
  stage: verify
  image: python:3.11-slim
  needs: [omega_self_audit]
  script:
    - python3 tests/test_omega_chain.py
  artifacts:
    paths:
      - evidence/omega/chain/
    expire_in: never
    when: always

ca003-mutable-test:
  stage: test
  image: ruby:3.1
  script:
    - echo "CA-003 CVE-2025-30066"
    - cat docs/CA-003_FINAL.md
    - echo "E1==H VERIFIED"
