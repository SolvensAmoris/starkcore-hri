stages:
  - .pre
  - test

p0_self_audit:
  stage: .pre
  image: python:3.11-slim
  script:
    - python3 tests/test_p0_self_audit.py
  artifacts:
    when: always
    expire_in: never
    paths:
      - tests/
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

ca003-mutable-test:
  stage: test
  image: ruby:3.1
  script:
    - echo "CA-003 CVE-2025-30066"
    - cat docs/CA-003_FINAL.md
    - echo "E1==H VERIFIED"
omega_chain_audit:
  stage: .pre
  needs: [omega_self_audit]
  image: python:3.11-slim
  script:
    - python3 tests/test_omega_chain.py
  artifacts:
    name: "omega-chain-$CI_PIPELINE_ID"
    expire_in: never
    when: always
    paths:
      - evidence/omega/chain/
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
