stages:
    - audit
    - deploy

ca002_firewall:
  stage: audit
  image:
    name: alpine/git
    entrypoint: [""]
  script:
        - git fetch --tags
        - git cat-file -t $CI_COMMIT_TAG
        - git cat-file -t $CI_COMMIT_TAG | grep -q tag
        - echo OK_tag_anotado
        - git cat-file -p $CI_COMMIT_TAG
  rules:
        - if: $CI_COMMIT_TAG

deploy:
  stage: deploy
  image:
    name: alpine/git
    entrypoint: [""]
  script:
        - echo deploy_ok
  rules:
        - if: $CI_COMMIT_TAG
  needs:
        - ca002_firewall
