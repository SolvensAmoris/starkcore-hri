ca002-firewall:
  script: |
    TYPE=$(git cat-file -t $CI_COMMIT_TAG 2>/dev/null || echo notag)
    echo "STARKCORE CA-002/CA-003 TYPE $TYPE TAG $CI_COMMIT_TAG"
    if [ "$TYPE" = "commit" ]; then 
      echo "BLOCKED E==H CVE-2025-30066 mutable tag - Usa tag anotado E1==H"
      exit 1
    else 
      echo "PASSED E!=H E1==H SHA inmutable"
      exit 0
    fi

ca003-mutable-test:
  script: |
    /tmp/ca003-test.sh
