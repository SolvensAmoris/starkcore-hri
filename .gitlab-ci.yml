stages:
    - audit
    - deploy

ca002_firewall:
  stage: audit
  image: alpine/git
  script:
        - chmod +x ca002-check.sh
        - |
      echo "StarkCore Firewall - Validando E ≡ H"
      for TAG in $(git tag -l); do
        echo "---"
        ./ca002-check.sh $TAG || exit 1
      done
  rules:
        - if: $CI_COMMIT_TAG

deploy:
  stage: deploy
  script:
        - echo "✅ Deploy solo si pasó el firewall"
  rules:
        - if: $CI_COMMIT_TAG
  needs:
        - ca002_firewall
