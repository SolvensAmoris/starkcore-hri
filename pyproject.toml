[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "starkcore-hammer"
version = "0.9.0"
description = "Detector forense de clonación diacrónica de trayectorias para grafos y modelos"
readme = "README.md"
authors = [{ name = "StarkCore Labs" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.20.0",
]

[project.scripts]
starkcore-hammer = "starkcore.hammer:main"
